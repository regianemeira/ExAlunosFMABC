<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memória FMABC</title>
<style>
:root{--azul:#4B5172;--verde:#339C5B;--verde-escuro:#377166;--verde-claro:#C6E2B4;--bg:#F7F9F8;--br:#D8DFDB;--texto:#232738;--muted:#555E70;--shadow:0 14px 35px rgba(35,39,56,.10)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--texto);font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;line-height:1.6;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;background-image:var(--bg-image);background-size:cover;background-position:center;background-repeat:no-repeat;opacity:var(--bg-opacity,.15);z-index:-1;pointer-events:none}
.top-nav{background:var(--azul);padding:.8rem 2.5rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--verde-claro);box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}.brand-logo{display:flex;align-items:center;text-decoration:none}.logo-img{height:45px;width:auto;display:block;object-fit:contain;background:#fff;padding:4px 10px;border-radius:8px}.page-home-link{color:#fff;text-decoration:none;font-size:.88rem;font-weight:800;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);transition:.2s}.page-home-link:hover{background:var(--verde);border-color:var(--verde)}
.public-memory-menu{background:rgba(255,255,255,.97);border-bottom:1px solid rgba(75,81,114,.16);box-shadow:0 3px 14px rgba(15,23,42,.07);position:relative;z-index:90}.public-memory-menu-inner{max-width:1280px;margin:0 auto;padding:0 24px;min-height:58px;display:flex;align-items:center}.public-memory-menu-list{width:100%;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:8px 0}.public-memory-menu-link{flex:0 0 auto;display:inline-flex;align-items:center;min-height:38px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--azul);font-size:.86rem;font-weight:800;white-space:nowrap;transition:all .2s ease}.public-memory-menu-link:hover,.public-memory-menu-link:focus-visible,.public-memory-menu-link.active{color:#fff;background:var(--verde);outline:none}
.page-container{max-width:1180px;margin:0 auto;padding:46px 24px 70px}.page-hero{background:linear-gradient(135deg,var(--azul) 0%,var(--verde-escuro) 100%);border-radius:24px;padding:48px 44px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}.page-hero::after{content:"";position:absolute;width:420px;height:420px;right:-120px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(51,156,91,.35),transparent 68%);pointer-events:none}.page-kicker{display:inline-block;text-transform:uppercase;letter-spacing:.08em;font-size:.76rem;font-weight:800;color:var(--verde-claro);margin-bottom:10px}.page-title{font-size:clamp(2rem,4vw,3.2rem);line-height:1.15;margin:0 0 14px;position:relative;z-index:1}.page-subtitle{max-width:820px;color:#E9EEF0;margin:0;font-size:1.02rem;position:relative;z-index:1}.page-cover{margin-top:26px;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.18);background:#fff}.page-cover img{display:block;width:100%;max-height:460px;object-fit:cover}.page-content{margin-top:28px;background:rgba(255,255,255,.96);border:1px solid rgba(75,81,114,.12);border-radius:18px;padding:34px;box-shadow:0 10px 30px rgba(15,23,42,.07)}.page-content-text{color:var(--texto);font-size:1rem;line-height:1.9}.page-content-text p{margin:0 0 1rem}.page-content-text h2,.page-content-text h3,.page-content-text h4{color:var(--azul);margin:1.4rem 0 .6rem}.page-content-text a{color:var(--verde);font-weight:700}.page-content-text ul,.page-content-text ol{padding-left:1.5rem}.page-content-text blockquote{border-left:4px solid var(--verde);padding:8px 16px;margin:1rem 0;background:#f4f7f5}.page-content>h2{color:var(--azul);margin-top:0}.unavailable{max-width:800px;margin:60px auto;padding:40px;background:#fff;border:1px solid var(--br);border-radius:18px;text-align:center;box-shadow:var(--shadow)}.unavailable h1{color:var(--azul);margin-top:0}.unavailable p{color:var(--muted)}.footer{background:var(--azul);color:#fff;padding:2.2rem 2rem;border-top:4px solid var(--verde);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}.footer p{margin:0;color:#F2F5F3;font-size:.94rem}.footer .credit{margin-top:8px;color:var(--verde-claro);font-weight:700;font-size:.84rem}
@media(max-width:700px){.top-nav{padding:.7rem 1rem;gap:10px}.logo-img{height:40px}.page-home-link{font-size:.8rem;padding:8px 11px}.public-memory-menu-inner{padding:0 12px}.page-container{padding:28px 14px 48px}.page-hero{padding:32px 24px}.page-content{padding:22px}}
</style>
<style id="fmabc-menu-modern-animation">
  /* Menu principal no estilo institucional da referência: faixa branca, logo à esquerda e navegação horizontal. */
  .top-nav {
    background: #fff !important;
    border-bottom: 1px solid rgba(75,81,114,.12) !important;
    box-shadow: 0 4px 18px rgba(20,35,60,.06) !important;
    padding: 10px clamp(18px, 2.8vw, 34px) !important;
    min-height: 82px;
    gap: clamp(18px, 2.4vw, 34px);
  }
  .brand-logo {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding-right: clamp(8px, 1vw, 18px);
  }
  .logo-img {
    height: 54px !important;
    max-width: 230px !important;
    background: transparent !important;
    padding: 0 !important;
    border-radius: 0 !important;
    filter: none !important;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), filter .35s ease;
  }
  .brand-logo:hover .logo-img {
    transform: translateY(-1px) scale(1.025);
    filter: drop-shadow(0 5px 8px rgba(24,54,90,.12));
  }
  .public-memory-menu {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    position: static !important;
  }
  .public-memory-menu-inner {
    min-height: 0;
    padding: 0 !important;
    margin: 0 !important;
    display: flex;
    align-items: center;
  }
  .public-memory-menu-list {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: stretch;
    gap: 0;
    overflow-x: auto;
    overflow-y: visible;
    scrollbar-width: none;
    padding: 0 !important;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
  }
  .public-memory-menu-list::-webkit-scrollbar { display: none; }
  .public-memory-menu-link {
    position: relative;
    flex: 0 0 auto;
    min-height: 48px;
    padding: 0 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #30456f !important;
    background: transparent !important;
    border-radius: 0 !important;
    text-decoration: none;
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: .015em;
    white-space: nowrap;
    transition: color .25s ease, transform .28s cubic-bezier(.2,.7,.2,1), background-color .25s ease;
    animation: memoriaMenuIn .48s both;
  }
  .public-memory-menu-link + .public-memory-menu-link::before {
    content: '';
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 1px;
    background: rgba(77,101,145,.34);
    transition: opacity .25s ease, transform .25s ease;
  }
  .public-memory-menu-link::after {
    content: '';
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 3px;
    height: 3px;
    border-radius: 99px;
    background: linear-gradient(90deg, #339c5b, #1c8b49);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform .32s cubic-bezier(.2,.7,.2,1);
  }
  .public-memory-menu-link:hover,
  .public-memory-menu-link:focus-visible {
    color: #1e8c4d !important;
    transform: translateY(-1px);
    outline: none;
  }
  .public-memory-menu-link:hover::after,
  .public-memory-menu-link:focus-visible::after,
  .public-memory-menu-link.active::after,
  .public-memory-menu-link[aria-current="page"]::after { transform: scaleX(1); }
  .public-memory-menu-link:hover::before,
  .public-memory-menu-link:focus-visible::before { opacity: .16; transform: scaleY(.72); }
  .public-memory-menu-link.active,
  .public-memory-menu-link[aria-current="page"] { color: #1e8c4d !important; font-weight: 800; }
  .public-memory-menu-link:nth-child(2){animation-delay:.04s}
  .public-memory-menu-link:nth-child(3){animation-delay:.08s}
  .public-memory-menu-link:nth-child(4){animation-delay:.12s}
  .public-memory-menu-link:nth-child(5){animation-delay:.16s}
  .public-memory-menu-link:nth-child(6){animation-delay:.20s}
  .public-memory-menu-link:nth-child(7){animation-delay:.24s}
  @keyframes memoriaMenuIn {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .admin-nav-actions { margin-left: auto; flex: 0 0 auto; }
  @media (max-width: 1000px) {
    .top-nav { gap: 14px; }
    .public-memory-menu-link { padding: 0 13px; font-size: .78rem; }
    .public-memory-menu-link::after { left: 13px; right: 13px; }
  }
  @media (max-width: 760px) {
    .top-nav { min-height: auto; flex-wrap: wrap; padding: 10px 14px !important; gap: 8px 14px; }
    .brand-logo { flex: 1 1 auto; }
    .logo-img { height: 48px !important; }
    .public-memory-menu { order: 3; flex: 1 0 100%; }
    .public-memory-menu-link { min-height: 44px; padding: 0 13px; font-size: .76rem; }
    .public-memory-menu-link::after { bottom: 1px; left: 12px; right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .public-memory-menu-link, .logo-img { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<nav class="top-nav" aria-label="Navegação principal">
    <a href="index.html" class="brand-logo">
      <img src="https://www.fmabc.br/img/logo-fmabc.81be2f48.png" alt="Logotipo FMABC Centro Universitário" class="logo-img">
    </a>

    <nav class="public-memory-menu" aria-label="Navegação da memória institucional">
      <div class="public-memory-menu-inner">
        <div id="siteMenuContainer" class="public-memory-menu-list"></div>
      </div>
    </nav>
  </nav>
<main class="page-container" id="pageRoot"><div class="unavailable"><h1>Carregando página...</h1><p>Aguarde enquanto o conteúdo é carregado.</p></div></main>
<footer class="footer"><p id="footerAddress">Endereço: Av. Príncipe de Gales, 821 - Vila Príncipe de Gales, Santo André - SP</p><p id="footerEmail">Contato: contato@fmabc.br</p><div class="credit">Desenvolvido por Regiane Meira</div></footer>
<script>
const CLOUDFLARE_API_URL='https://fmabc-acervo-api.armredessociais.workers.dev';
const MENU_PADRAO=[
{id:'inicio',pageId:'inicio',label:'Início',url:'index.html',target:'_self',visible:true},
{id:'linha-do-tempo',pageId:'linha-do-tempo',label:'Linha do tempo',url:'linha-do-tempo.html',target:'_self',visible:true},
{id:'depoimentos-ex-alunos',pageId:'depoimentos-ex-alunos',label:'Depoimentos de ex-alunos',url:'depoimentos-ex-alunos.html',target:'_self',visible:true},
{id:'galeria-diretores-reitores',pageId:'galeria-diretores-reitores',label:'Fotos e galeria de diretores e reitores',url:'galeria-diretores-reitores.html',target:'_self',visible:true},
{id:'professores-emeritos',pageId:'professores-emeritos',label:'Professores eméritos',url:'professores-emeritos.html',target:'_self',visible:true}
];
const SYSTEM_PAGE_IDS=['inicio','linha-do-tempo','depoimentos-ex-alunos','galeria-diretores-reitores','professores-emeritos'];
function normalizarMenu(valor){const arr=Array.isArray(valor)?valor:(Array.isArray(valor?.itens)?valor.itens:[]);return arr.filter(x=>x&&x.label&&x.url).map(x=>({...x,pageId:x.pageId||''}));}
function paginaAtual(){return (location.pathname.split('/').pop()||'pagina.html').toLowerCase();}
function renderMenu(itens){const el=document.getElementById('siteMenuContainer');if(!el)return;el.innerHTML='';(itens.length?itens:MENU_PADRAO).filter(i=>i.visible!==false).forEach(item=>{const a=document.createElement('a');a.className='public-memory-menu-link';a.href=item.url;a.textContent=item.label;a.target=item.target==='_blank'?'_blank':'_self';if(a.target==='_blank')a.rel='noopener noreferrer';const nome=String(item.url).split('?')[0].split('/').pop().toLowerCase();if(nome===paginaAtual()&&nome!=='pagina.html')a.classList.add('active');el.appendChild(a);});}
async function carregarMenu(){try{const r=await fetch(`${CLOUDFLARE_API_URL}/api/config/site_menu?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();renderMenu(normalizarMenu(d?.valor));}catch(e){renderMenu(MENU_PADRAO);}}
async function carregarVisual(){try{const [bg,foot]=await Promise.all([fetch(`${CLOUDFLARE_API_URL}/api/config/background_config?v=${Date.now()}`,{cache:'no-store'}),fetch(`${CLOUDFLARE_API_URL}/api/config/site_footer?v=${Date.now()}`,{cache:'no-store'})]);if(bg.ok){const v=(await bg.json())?.valor||{};if(v.imagem)document.documentElement.style.setProperty('--bg-image',`url("${v.imagem}")`);if(v.opacidade!=null)document.documentElement.style.setProperty('--bg-opacity',String(v.opacidade));}if(foot.ok){const v=(await foot.json())?.valor||{};if(v.endereco)document.getElementById('footerAddress').textContent='Endereço: '+v.endereco;if(v.email)document.getElementById('footerEmail').textContent='Contato via e-mail: '+v.email;}}catch(e){}}
function sanitizarHtmlPublico(html){
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  const permitidas=new Set(['P','BR','STRONG','B','EM','I','U','S','UL','OL','LI','A','H2','H3','H4','BLOCKQUOTE','IMG','DIV','SPAN']);
  doc.body.querySelectorAll('*').forEach(el=>{if(!permitidas.has(el.tagName)){el.replaceWith(...Array.from(el.childNodes));return;}Array.from(el.attributes).forEach(attr=>{const n=attr.name.toLowerCase();if(n.startsWith('on')||n==='style'||n==='srcdoc'){el.removeAttribute(attr.name);}});if(el.tagName==='A'){const href=el.getAttribute('href')||'';if(!/^https?:\/\//i.test(href)&&!href.startsWith('#')&& !href.startsWith('/'))el.removeAttribute('href');}if(el.tagName==='IMG'){const src=el.getAttribute('src')||'';if(!/^https?:\/\//i.test(src)&&!src.startsWith('/'))el.removeAttribute('src');el.setAttribute('loading','lazy');el.style.maxWidth='100%';el.style.height='auto';}});return doc.body.innerHTML;}
function adicionarMeta(name,content){if(!content)return;let m=document.querySelector(`meta[name="${name}"]`);if(!m){m=document.createElement('meta');m.name=name;document.head.appendChild(m);}m.content=content;}
async function carregarPagina(){
  const slug=new URLSearchParams(location.search).get('slug')||'';
  const root=document.getElementById('pageRoot');
  if(!slug){root.innerHTML='<div class="unavailable"><h1>Página não encontrada</h1><p>O endereço da página não contém um identificador válido.</p><p><a href="index.html">Voltar ao início</a></p></div>';return;}
  try{
    const r=await fetch(`${CLOUDFLARE_API_URL}/api/config/portal_pages?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const pages=Array.isArray(d?.valor?.pages)?d.valor.pages:[];const page=pages.find(p=>p&&p.tipo==='custom'&&String(p.slug||'').toLowerCase()===String(slug).toLowerCase());
    if(!page||page.visivel===false){root.innerHTML='<div class="unavailable"><h1>Página indisponível</h1><p>Esta página não está publicada no momento.</p><p><a href="index.html">Voltar ao início</a></p></div>';document.title='Página indisponível | Memória FMABC';return;}
    const publicTitle=page.titulo||'Memória FMABC';document.title=(page.seoTitulo||publicTitle)+' | Memória FMABC';adicionarMeta('description',page.seoDescricao||page.resumo||'');adicionarMeta('keywords',page.seoKeywords||'');
    root.innerHTML='';
    const hero=document.createElement('section');hero.className='page-hero';hero.innerHTML='<span class="page-kicker">Memória FMABC</span>';const h1=document.createElement('h1');h1.className='page-title';h1.textContent=publicTitle;hero.appendChild(h1);const sub=document.createElement('p');sub.className='page-subtitle';sub.textContent=page.resumo||'';hero.appendChild(sub);
    const banner=page.imagem||page.bannerUrl||'';if(banner){const cover=document.createElement('div');cover.className='page-cover';const img=document.createElement('img');img.src=banner;img.alt=page.bannerAlt||publicTitle;cover.appendChild(img);hero.appendChild(cover);}root.appendChild(hero);
    const content=document.createElement('section');content.className='page-content';const rich=document.createElement('div');rich.className='page-content-text';rich.innerHTML=sanitizarHtmlPublico(page.conteudo||'')||'Esta página ainda não possui conteúdo.';content.appendChild(rich);root.appendChild(content);
    if(page.conteudoSecundario){const sec=document.createElement('section');sec.className='page-content';const title=document.createElement('h2');title.textContent='Conteúdo complementar';sec.appendChild(title);const txt=document.createElement('div');txt.className='page-content-text';txt.innerHTML=sanitizarHtmlPublico(page.conteudoSecundario);sec.appendChild(txt);root.appendChild(sec);}
    if(page.informacoesAdicionais){const sec=document.createElement('section');sec.className='page-content';const title=document.createElement('h2');title.textContent='Informações adicionais';sec.appendChild(title);const txt=document.createElement('div');txt.className='page-content-text';txt.innerHTML=sanitizarHtmlPublico(page.informacoesAdicionais);sec.appendChild(txt);root.appendChild(sec);}
  }catch(e){console.error(e);root.innerHTML='<div class="unavailable"><h1>Não foi possível carregar a página</h1><p>Verifique a conexão com o portal e tente novamente.</p></div>';}
}
Promise.all([carregarMenu(),carregarVisual(),carregarPagina()]);
</script>
</body>
</html>
