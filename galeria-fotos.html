<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Fotos | FMABC</title>
<meta id="metaDescricaoGaleria" name="description" content="Galeria de Fotos institucional do Centro Universitário FMABC.">
<style>
:root{--azul-institucional:#4B5172;--verde-principal:#339C5B;--verde-escuro:#377166;--verde-pastel-suave:#E3EFD3;--slate-muted:#667085;--border-color:#D8DFDB;--bg:#F7F9F8;--texto:#232738}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--texto);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.top-nav{background:#fff;border-bottom:1px solid rgba(75,81,114,.12);box-shadow:0 6px 20px rgba(15,23,42,.08);padding:10px clamp(16px,3vw,36px);min-height:78px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:100}
.brand-logo{flex:0 0 auto;display:flex;align-items:center;text-decoration:none}
.logo-img{height:48px;width:auto;display:block;object-fit:contain;transition:transform .35s ease,filter .35s ease}
.brand-logo:hover .logo-img{transform:translateY(-1px) scale(1.025);filter:drop-shadow(0 5px 8px rgba(24,54,90,.12))}
.public-memory-menu{flex:1 1 auto;min-width:0;background:transparent;border:0;box-shadow:none;position:static}
.public-memory-menu-inner{min-height:0;display:flex;align-items:center}
.public-memory-menu-list{width:100%;display:flex;justify-content:flex-start;align-items:stretch;gap:0;overflow-x:auto;overflow-y:visible;scrollbar-width:none;padding:0;background:transparent;border:0;box-shadow:none}
.public-memory-menu-list::-webkit-scrollbar{display:none}
.public-memory-menu-link{position:relative;flex:0 0 auto;min-height:48px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;color:#30456f;text-decoration:none;font-size:.82rem;font-weight:700;letter-spacing:.015em;white-space:nowrap;transition:color .25s ease,transform .28s ease,background-color .25s ease}
.public-memory-menu-link+.public-memory-menu-link::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:1px;background:rgba(77,101,145,.34)}
.public-memory-menu-link::after{content:'';position:absolute;left:18px;right:18px;bottom:3px;height:3px;border-radius:99px;background:linear-gradient(90deg,#339c5b,#1c8b49);transform:scaleX(0);transform-origin:center;transition:transform .32s ease}
.public-memory-menu-link:hover,.public-memory-menu-link:focus-visible{color:#1e8c4d;transform:translateY(-1px);outline:none}
.public-memory-menu-link:hover::after,.public-memory-menu-link:focus-visible::after,.public-memory-menu-link.active::after,.public-memory-menu-link[aria-current="page"]::after{transform:scaleX(1)}
.public-memory-menu-link.active,.public-memory-menu-link[aria-current="page"]{color:#1e8c4d;font-weight:800}
.container{max-width:1280px;margin:0 auto;padding:32px 24px 48px}
.memoria-section{margin-top:10px;background:rgba(255,255,255,.94);border:1px solid rgba(75,81,114,.12);border-radius:18px;padding:34px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
.memoria-section-kicker{display:inline-block;font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--verde-principal);margin-bottom:8px}
.memoria-section h1{margin:0 0 10px;color:var(--azul-institucional);font-size:clamp(2rem,4vw,3rem);line-height:1.15}
.memoria-section .intro{margin:0;color:var(--slate-muted);line-height:1.65;max-width:820px}
.gallery-toolbar{margin-top:28px;padding:16px;border:1px solid #e3e8e5;border-radius:14px;background:#f8faf9;display:grid;grid-template-columns:1fr 220px;gap:10px}
.gallery-toolbar input,.gallery-toolbar select{width:100%;min-height:44px;border:1px solid var(--border-color);border-radius:10px;background:#fff;padding:10px 12px;color:#42506c;outline:none}
.gallery-toolbar input:focus,.gallery-toolbar select:focus{border-color:#9db8aa;box-shadow:0 0 0 3px rgba(51,156,91,.08)}
.albums{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.album-card{background:#fff;border:1px solid var(--border-color);border-radius:16px;overflow:hidden;box-shadow:0 8px 25px rgba(35,39,56,.06);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.album-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(35,39,56,.1);border-color:#bed1c4}
.album-cover{width:100%;height:230px;object-fit:cover;display:block;background:#eef2ef}
.album-body{padding:16px 17px 18px}.album-date{font-size:.74rem;color:var(--verde-escuro);font-weight:800;text-transform:uppercase;letter-spacing:.07em}.album-title{margin-top:7px;color:#2e3857;font-size:1.1rem;line-height:1.35}.album-desc{margin-top:8px;color:var(--slate-muted);font-size:.82rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.album-meta{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}.pill{background:#edf5ef;border:1px solid #d7eadc;color:#2f7d4b;border-radius:999px;padding:5px 8px;font-size:.68rem;font-weight:800}
.empty{grid-column:1/-1;padding:34px 20px;border:1px dashed #cbd7d0;border-radius:16px;background:#fff;text-align:center;color:var(--slate-muted)}
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.88);display:none;align-items:center;justify-content:center;padding:28px}.lightbox.active{display:flex}.lightbox-panel{width:min(1180px,100%);height:min(88vh,820px);display:grid;grid-template-columns:1fr 270px;gap:14px}.lightbox-main{position:relative;background:#0f172a;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12)}.lightbox-main img{max-width:100%;max-height:100%;object-fit:contain;display:block}.lb-close,.lb-nav{position:absolute;border:1px solid rgba(255,255,255,.2);background:rgba(15,23,42,.55);color:#fff;border-radius:10px;cursor:pointer}.lb-close{top:12px;right:12px;width:40px;height:40px;font-size:1.35rem}.lb-nav{top:50%;transform:translateY(-50%);width:42px;height:52px;font-size:1.8rem}.lb-prev{left:12px}.lb-next{right:12px}.lb-close:hover,.lb-nav:hover{background:rgba(51,156,91,.8)}.lightbox-side{background:#fff;border-radius:16px;padding:18px;overflow:auto}.lightbox-side h2{margin:0;color:#2e3857;font-size:1.25rem}.lightbox-side p{margin-top:8px;color:var(--slate-muted);font-size:.82rem;line-height:1.55}.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}.thumb{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:#eef2ef}.thumb.active{border-color:var(--verde-principal)}.thumb img{width:100%;height:82px;object-fit:cover;display:block}
.site-footer{background:var(--azul-institucional);color:#fff;padding:2.5rem 2rem;margin-top:1rem;border-top:4px solid var(--verde-principal);display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}.site-footer p{margin:0;color:#dbe1eb;font-size:.9rem}.developer-credit{font-size:.8rem;color:#c6e2b4;font-weight:700;margin-top:8px}
@media(max-width:980px){.albums{grid-template-columns:repeat(2,minmax(0,1fr))}.lightbox-panel{grid-template-columns:1fr}.lightbox-side{max-height:230px}.thumbs{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.top-nav{flex-wrap:wrap;gap:8px 14px}.public-memory-menu{flex:1 0 100%;order:3}.public-memory-menu-list{justify-content:flex-start}.public-memory-menu-link{min-height:44px;padding:0 13px;font-size:.76rem}.public-memory-menu-link::after{left:12px;right:12px;bottom:1px}.container{padding:24px 16px 42px}.memoria-section{padding:24px 20px}.gallery-toolbar{grid-template-columns:1fr}}
@media(max-width:650px){.albums{grid-template-columns:1fr}.album-cover{height:220px}.lightbox{padding:10px}.lightbox-panel{height:94vh}.thumbs{grid-template-columns:repeat(4,1fr)}.memoria-section h1{font-size:2rem}}
</style>
</head>
<body>
<nav class="top-nav" aria-label="Navegação principal">
  <a href="index.html" class="brand-logo" aria-label="Página inicial do Acervo FMABC"><img src="https://www.fmabc.br/img/logo-fmabc.81be2f48.png" alt="Logotipo FMABC Centro Universitário" class="logo-img"></a>
  <nav class="public-memory-menu" aria-label="Navegação da memória institucional"><div class="public-memory-menu-inner"><div id="siteMenuContainer" class="public-memory-menu-list"></div></div></nav>
</nav>

<div class="container">
  <section class="memoria-section" id="heroGaleriaPagina">
    <span class="memoria-section-kicker">Memória institucional</span>
    <h1 id="tituloGaleriaPagina">Galeria de Fotos</h1>
    <p id="introGaleriaPagina" class="intro">Registros fotográficos de eventos, cerimônias e momentos que fazem parte da história do Centro Universitário FMABC.</p>
    <div class="gallery-toolbar" aria-label="Filtros da galeria">
      <input id="buscaGaleriaPublica" type="search" placeholder="Pesquisar álbum" autocomplete="off">
      <select id="categoriaGaleriaPublica"><option value="">Todas as categorias</option></select>
    </div>
    <section id="albunsGaleriaPublica" class="albums" aria-live="polite"></section>
  </section>
</div>

<footer class="site-footer"><p>Centro Universitário FMABC · Galeria de Fotos</p><div class="developer-credit">Desenvolvido por Regiane Meira</div></footer>

<div class="lightbox" id="galeriaLightbox" aria-hidden="true"><div class="lightbox-panel"><div class="lightbox-main"><img id="galeriaLightboxImg" alt=""><button type="button" class="lb-close" id="galeriaLightboxClose" aria-label="Fechar">×</button><button type="button" class="lb-nav lb-prev" id="galeriaLightboxPrev" aria-label="Foto anterior">‹</button><button type="button" class="lb-nav lb-next" id="galeriaLightboxNext" aria-label="Próxima foto">›</button></div><aside class="lightbox-side"><h2 id="galeriaLightboxTitle"></h2><p id="galeriaLightboxDesc"></p><div id="galeriaLightboxThumbs" class="thumbs"></div></aside></div></div>

<script>
const CLOUDFLARE_API_URL='https://fmabc-acervo-api.armredessociais.workers.dev';
const GALERIA_FOTOS_CONFIG_KEY='fmabc_gallery_albums';
const MENU_PADRAO=[
  {id:'inicio',pageId:'inicio',label:'Início',url:'index.html',target:'_self',visible:true},
  {id:'linha-do-tempo',pageId:'linha-do-tempo',label:'Linha do tempo',url:'linha-do-tempo.html',target:'_self',visible:true},
  {id:'galeria-diretores-reitores',pageId:'galeria-diretores-reitores',label:'Galeria de diretores e reitores',url:'galeria-diretores-reitores.html',target:'_self',visible:true},
  {id:'depoimentos-ex-alunos',pageId:'depoimentos-ex-alunos',label:'Depoimentos de ex-alunos',url:'depoimentos-ex-alunos.html',target:'_self',visible:true},
  {id:'galeria-fotos',pageId:'galeria-fotos',label:'Galeria de Fotos',url:'galeria-fotos.html',target:'_self',visible:true},
  {id:'professores-emeritos',pageId:'professores-emeritos',label:'Professores eméritos',url:'professores-emeritos.html',target:'_self',visible:true}
];
let albuns=[],albumAtual=null,fotoAtual=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function semCache(v){return String(v||'')+(String(v||'').includes('?')?'&':'?')+'v='+Date.now();}
function dataBR(v){if(!v)return 'Data não informada';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString('pt-BR');}
function normalizarMenu(itens){const usados=new Set();const lista=Array.isArray(itens)?itens:[];return lista.map((x,i)=>{if(!x||!x.label||!x.url)return null;const id=String(x.id||x.pageId||`menu-${i}`);if(usados.has(id))return null;usados.add(id);return {id,pageId:String(x.pageId||id),label:String(x.label),url:String(x.url),target:x.target==='_blank'?'_blank':'_self',visible:x.visible!==false};}).filter(Boolean);}
async function carregarMenu(){let menu=[];try{const r=await fetch(`${CLOUDFLARE_API_URL}/api/config/site_menu?v=${Date.now()}`,{cache:'no-store'});if(r.ok){const d=await r.json();menu=normalizarMenu(d?.valor?.itens||d?.valor);}}catch(e){}if(!menu.length)menu=MENU_PADRAO.map(x=>({...x}));if(!menu.some(x=>x.id==='galeria-fotos'))menu.push(MENU_PADRAO.find(x=>x.id==='galeria-fotos'));const c=document.getElementById('siteMenuContainer');c.innerHTML='';menu.filter(x=>x&&x.visible!==false).forEach(item=>{const a=document.createElement('a');a.className='public-memory-menu-link';a.href=item.url;a.textContent=item.label;a.target=item.target;a.rel=item.target==='_blank'?'noopener noreferrer':'';const caminho=location.pathname.split('/').pop()||'index.html';const mesma=(caminho===String(item.url).split('?')[0] || (item.id==='galeria-fotos'&&caminho==='galeria-fotos.html'));if(mesma){a.classList.add('active');a.setAttribute('aria-current','page');}c.appendChild(a);});}
async function carregarPaginaConfig(){try{const r=await fetch(`${CLOUDFLARE_API_URL}/api/config/portal_pages?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)return true;const d=await r.json();const lista=Array.isArray(d?.valor?.pages)?d.valor.pages:[];const p=lista.find(x=>String(x?.id)==='galeria-fotos');if(p?.visivel===false){document.getElementById('albunsGaleriaPublica').innerHTML='<div class="empty"><strong>Esta página não está publicada.</strong><div style="margin-top:6px">O conteúdo da Galeria de Fotos está temporariamente indisponível.</div></div>';return false;}if(p?.titulo)document.getElementById('tituloGaleriaPagina').textContent=p.titulo;if(p?.resumo)document.getElementById('introGaleriaPagina').textContent=p.resumo;document.title=`${p?.seoTitulo||p?.titulo||'Galeria de Fotos'} | FMABC`;const meta=document.getElementById('metaDescricaoGaleria');if(meta)meta.content=String(p?.seoDescricao||p?.resumo||'Galeria de Fotos institucional do Centro Universitário FMABC.').slice(0,300);if(p?.imagem){const hero=document.getElementById('heroGaleriaPagina');hero.style.backgroundImage=`linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.94)),url("${String(p.imagem).replaceAll('"','&quot;')}")`;hero.style.backgroundSize='cover';hero.style.backgroundPosition='center';}return true;}catch(e){return true;}}
function normalizarAlbum(a,i){if(!a||typeof a!=='object'||!a.titulo)return null;const fotos=Array.isArray(a.fotos)?a.fotos.filter(f=>f&&f.url).map((f,j)=>({url:String(f.url),legenda:String(f.legenda||''),ordem:Number(f.ordem||j+1)})).sort((x,y)=>x.ordem-y.ordem):[];return {id:String(a.id||i),titulo:String(a.titulo),data:String(a.data||''),descricao:String(a.descricao||''),categoria:String(a.categoria||''),capa:String(a.capa||fotos[0]?.url||''),publicado:a.publicado!==false,ordem:Number(a.ordem||i+1),fotos};}
async function carregarAlbuns(){const el=document.getElementById('albunsGaleriaPublica');try{const r=await fetch(`${CLOUDFLARE_API_URL}/api/config/${encodeURIComponent(GALERIA_FOTOS_CONFIG_KEY)}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar os álbuns.');const d=await r.json();const lista=Array.isArray(d?.valor?.albuns)?d.valor.albuns:(Array.isArray(d?.valor)?d.valor:[]);albuns=lista.map(normalizarAlbum).filter(Boolean).filter(a=>a.publicado&&a.fotos.length).sort((a,b)=>a.ordem-b.ordem);preencherCategorias();render();const id=new URLSearchParams(location.search).get('album');if(id)abrirAlbum(id);}catch(e){el.innerHTML='<div class="empty">Não foi possível carregar a Galeria de Fotos no momento.</div>';}}
function preencherCategorias(){const sel=document.getElementById('categoriaGaleriaPublica');const cats=[...new Set(albuns.map(a=>a.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));sel.innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');}
function listaFiltrada(){const q=document.getElementById('buscaGaleriaPublica').value.trim().toLowerCase();const c=document.getElementById('categoriaGaleriaPublica').value;return albuns.filter(a=>(!q||`${a.titulo} ${a.descricao} ${a.categoria}`.toLowerCase().includes(q))&&(!c||a.categoria===c));}
function render(){const el=document.getElementById('albunsGaleriaPublica');const lista=listaFiltrada();if(!lista.length){el.innerHTML='<div class="empty"><strong>Nenhum álbum encontrado.</strong><div style="margin-top:6px">Tente outro termo de pesquisa ou categoria.</div></div>';return;}el.innerHTML=lista.map(a=>`<article class="album-card" tabindex="0" role="button" data-id="${esc(a.id)}"><img class="album-cover" loading="lazy" src="${esc(semCache(a.capa))}" alt="${esc(a.titulo)}"><div class="album-body"><div class="album-date">${esc(dataBR(a.data))}</div><h2 class="album-title">${esc(a.titulo)}</h2><p class="album-desc">${esc(a.descricao||'Confira as fotos deste álbum.')}</p><div class="album-meta"><span class="pill">${a.fotos.length} ${a.fotos.length===1?'foto':'fotos'}</span>${a.categoria?`<span class="pill">${esc(a.categoria)}</span>`:''}</div></div></article>`).join('');el.querySelectorAll('.album-card').forEach(card=>{const id=card.dataset.id;card.addEventListener('click',()=>abrirAlbum(id));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();abrirAlbum(id);}});});}
function abrirAlbum(id){const a=albuns.find(x=>String(x.id)===String(id));if(!a)return;albumAtual=a;fotoAtual=0;document.getElementById('galeriaLightbox').classList.add('active');document.getElementById('galeriaLightbox').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';atualizarLightbox();}
function atualizarLightbox(){if(!albumAtual)return;const fotos=albumAtual.fotos||[];if(!fotos.length)return;fotoAtual=(fotoAtual+fotos.length)%fotos.length;const f=fotos[fotoAtual];document.getElementById('galeriaLightboxImg').src=semCache(f.url);document.getElementById('galeriaLightboxImg').alt=f.legenda||albumAtual.titulo;document.getElementById('galeriaLightboxTitle').textContent=albumAtual.titulo;document.getElementById('galeriaLightboxDesc').textContent=albumAtual.descricao||dataBR(albumAtual.data);document.getElementById('galeriaLightboxThumbs').innerHTML=fotos.map((x,i)=>`<button type="button" class="thumb ${i===fotoAtual?'active':''}" data-foto="${i}" aria-label="Foto ${i+1}"><img src="${esc(semCache(x.url))}" alt=""></button>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>{fotoAtual=Number(b.dataset.foto);atualizarLightbox();}));}
function fecharLightbox(){document.getElementById('galeriaLightbox').classList.remove('active');document.getElementById('galeriaLightbox').setAttribute('aria-hidden','true');document.body.style.overflow='';albumAtual=null;}
document.getElementById('buscaGaleriaPublica').addEventListener('input',render);document.getElementById('categoriaGaleriaPublica').addEventListener('change',render);document.getElementById('galeriaLightboxClose').addEventListener('click',fecharLightbox);document.getElementById('galeriaLightboxPrev').addEventListener('click',()=>{fotoAtual--;atualizarLightbox();});document.getElementById('galeriaLightboxNext').addEventListener('click',()=>{fotoAtual++;atualizarLightbox();});document.getElementById('galeriaLightbox').addEventListener('click',e=>{if(e.target.id==='galeriaLightbox')fecharLightbox();});document.addEventListener('keydown',e=>{if(!albumAtual)return;if(e.key==='Escape')fecharLightbox();if(e.key==='ArrowLeft'){fotoAtual--;atualizarLightbox();}if(e.key==='ArrowRight'){fotoAtual++;atualizarLightbox();}});
(async()=>{await carregarMenu();const visivel=await carregarPaginaConfig();if(visivel!==false)await carregarAlbuns();})();
</script>
</body>
</html>
